name: Bootstrap publish

# One-time first publish of @tolt/api@0.1.0 to npm using a token. npm OIDC
# trusted publishing cannot create a package that does not exist yet, so the
# very first version has to go up with a token. Delete this workflow once
# trusted publishing is configured; release.yml (OIDC) handles every version
# after that.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
